name: infra-and-deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (sandbox|prod)"
        required: true
        default: "sandbox"
        type: choice
        options: [sandbox, prod]
  push:
    branches: ["main"]

permissions:
  id-token: write   # OIDC to Azure
  contents: read

env:
  TF_DIR: terraform
  PYTHON_VERSION: "3.10"

jobs:
  infra:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}        # SP with federated credentials
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var-file="envs/${{ github.event.inputs.env || 'sandbox' }}.tfvars" -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        id: tfout
        working-directory: ${{ env.TF_DIR }}
        # Nota: asegúrate de tener 'output "function_app_name"' en outputs.tf
        run: |
          echo "FUNC_NAME=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT
          echo "ENV=${{ github.event.inputs.env || 'sandbox' }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Opcional: lint/format (ruff + black) si quieres calidad automática
      - name: Lint (ruff)
        if: always()
        run: |
          pip install ruff
          ruff check app functions

      - name: Deploy Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.FUNC_NAME }}
          package: .
          respect-funcignore: true
